preset_version: "0.1.0"
initial_physics:
  enabled: true
  rules:
    body.mass.positive: {enabled: true, severity: error, failure_action: report, params: {}}
    body.radius.positive: {enabled: true, severity: error, failure_action: report, params: {}}
    body.density.bounds:
      enabled: false
      severity: warning
      failure_action: report
      params: {min_kg_m3: 3500.0, max_kg_m3: 7000.0, kinds: [PLANET]}
    system.initial_overlap:
      enabled: true
      severity: error
      failure_action: report
      params: {minimum_surface_gap_m: 0.0}
    system.barycenter:
      enabled: true
      severity: warning
      failure_action: report
      params: {max_relative_position_error: 0.0000000001, max_relative_velocity_error: 0.0000000001}
