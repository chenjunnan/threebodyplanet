schema_version: "0.4.0"
experiment:
  id: p0-g2-chaotic-worlds
  seed: 20261116
  candidate_count: 100
world_generation:
  body_count: {stars: 3, planets: 1}
  generator:
    type: stochastic_conics
    version: "0.4.0"
    stars:
      mass_solar: {min: 0.3, max: 8.0, distribution: log_uniform}
    planet:
      mass_earth: {min: 0.1, max: 8.0, distribution: log_uniform}
      density_kg_m3: {min: 2800.0, max: 8500.0, distribution: uniform}
    geometry:
      inner:
        periapsis_m: {min: 1.0e+10, max: 2.0e+12, distribution: log_uniform}
        eccentricity: {min: 0.0, max: 1.8, distribution: uniform}
      outer:
        periapsis_m: {min: 2.0e+10, max: 2.0e+13, distribution: log_uniform}
        eccentricity: {min: 0.0, max: 2.0, distribution: uniform}
      planet:
        periapsis_m: {min: 2.0e+9, max: 5.0e+12, distribution: log_uniform}
        eccentricity: {min: 0.0, max: 2.2, distribution: uniform}
        host_weights: {star-1: 1.0, star-2: 1.0, star-3: 1.0, barycenter: 1.0}
      orientation:
        normal: isotropic
        node: uniform
        periapsis_argument: uniform
      anomaly:
        distribution: true_anomaly_uniform_on_valid_domain
      velocity_kick:
        distribution: isotropic_speed_fraction
        speed_scale_fraction: {min: 0.0, max: 0.6, distribution: uniform}
screening:
  preset: research
  default_rule_state: disabled
  fail_fast: false
  initial_physics:
    enabled: true
    rules: {}
  exploration:
    enabled: false
runtime:
  simulation_enabled: false
output:
  max_candidates: 10000
  format: json
