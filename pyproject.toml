[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-body-planet"
version = "0.3.0"
description = "Reproducible three-star orbital, radiation, and thermal reference models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24,<3",
  "pydantic>=2.5,<3",
  "PyYAML>=6.0,<7",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4", "rebound>=4.4,<5"]
physics = ["rebound>=4.4,<5"]

[project.scripts]
threebody = "threebody.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
threebody = ["resources/presets/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

