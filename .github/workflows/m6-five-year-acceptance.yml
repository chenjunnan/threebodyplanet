name: M6 Five-Year Scientific Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-year-ias15-thermal-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install real N-body and scientific solvers
        run: python -m pip install -e '.[dev,physics,viz]'
      - name: Run real 5-Julian-year 6-hour-output M5A -> M3/C0/C1 -> M4
        run: |
          mkdir -p /tmp/m6-five-year-acceptance
          python scripts/m6_five_year_acceptance.py --artifact-root /tmp/m6-five-year-acceptance
      - name: Publish reproducible scientific acceptance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-five-year-acceptance
          path: /tmp/m6-five-year-acceptance/m6_five_year_acceptance.json
          if-no-files-found: warn
          retention-days: 14
