name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project with physics and visualization tests
        run: python -m pip install -e '.[dev,physics,viz]'
      - name: Verify optional scientific and visualization backends
        run: python -c "import plotly, rebound; print(plotly.__version__, rebound.__version__)"
      - name: Run tests
        run: pytest -q
      - name: Run Ruff
        run: ruff check .
